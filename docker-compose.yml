version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: english_flow_db
    restart: always
    environment:
      POSTGRES_USER: english_flow_user
      POSTGRES_PASSWORD: english_flow_pass
      POSTGRES_DB: english_flow_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: english_flow_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@englishflow.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  postgres_data:
